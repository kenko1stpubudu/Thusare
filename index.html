<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thusare Talking Hands – Guest Registration</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --g9:#0a2318;--g8:#0d3320;--g7:#115c38;--g6:#16803d;--g5:#22a854;
  --g4:#3dbd6e;--g3:#6ed99a;--g2:#a8f0c4;--g1:#d4fae6;--g0:#edfaf3;
  --gold:#c9a84c;--gold2:#e8d4a0;--gold0:#fdf8ec;
  --cream:#faf7f2;--white:#ffffff;
  --ink:#0e1f12;--ink2:#2d4a35;--ink3:#4a7055;--ink4:#7aaa8a;
  --r:#c0392b;--shadow-lg:0 6px 40px rgba(10,35,24,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Outfit',sans-serif;background:var(--cream)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle at 15% 25%,rgba(22,128,61,.07) 0%,transparent 45%),
  radial-gradient(circle at 85% 75%,rgba(201,168,76,.07) 0%,transparent 45%);}
.shell{position:relative;z-index:1;height:100vh;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;background:var(--white);box-shadow:var(--shadow-lg);}
/* HEADER */
.hdr{background:var(--g9);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.hdr-logo{display:flex;align-items:center;flex-shrink:0}
.hdr-logo img{height:36px;width:auto}
.hdr-spacer{flex:1}
.lang-btns{display:flex;gap:6px;align-items:center;flex-shrink:0;position:relative}
.lang-btn{border:1.5px solid rgba(110,217,154,.35);background:transparent;color:var(--g3);
  border-radius:8px;padding:5px 11px;font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .18s;letter-spacing:.03em}
.lang-btn:hover{background:rgba(110,217,154,.12);border-color:var(--g3)}
.lang-btn.active{background:var(--g6);color:#fff;border-color:var(--g6)}
/* LANG DROPDOWN */
.lang-globe{
  width:32px;height:32px;border-radius:8px;
  border:1.5px solid rgba(110,217,154,.35);background:transparent;
  color:var(--g3);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:all .18s;flex-shrink:0;position:relative;
}
.lang-globe:hover,.lang-globe.open{background:rgba(110,217,154,.15);border-color:var(--g3)}
.lang-globe.lang-active{background:var(--g6);border-color:var(--g6)}
.lang-dropdown{
  position:absolute;top:calc(100% + 8px);right:0;
  background:var(--g9);border:1px solid var(--g7);
  border-radius:14px;padding:6px;min-width:180px;
  box-shadow:0 8px 32px rgba(0,0,0,.35);
  display:none;flex-direction:column;gap:2px;z-index:999;
}
.lang-dropdown.open{display:flex}
.lang-opt{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:10px;cursor:pointer;
  font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;
  color:var(--g3);transition:all .15s;border:none;background:transparent;
  text-align:left;width:100%;
}
.lang-opt:hover{background:var(--g8);color:#fff}
.lang-opt.active{background:var(--g6);color:#fff;font-weight:600}
.lang-opt .flag{font-size:18px;width:24px;text-align:center}
.lang-sep{height:1px;background:var(--g8);margin:3px 4px}
.hdr-live{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--g3);
  padding-left:8px;border-left:1px solid rgba(110,217,154,.2)}
.home-btn{
  width:32px;height:32px;border-radius:8px;
  background:transparent;border:1.5px solid rgba(110,217,154,.35);
  color:var(--g3);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .18s;flex-shrink:0;
}
.home-btn svg{width:15px;height:15px}
.home-btn:hover{background:rgba(110,217,154,.15);border-color:var(--g3);color:#fff}
.home-btn.pulse-anim{animation:homePulse .4s ease;}
@keyframes homePulse{0%{transform:scale(1)}50%{transform:scale(.85)}100%{transform:scale(1)}}
.dot{width:6px;height:6px;border-radius:50%;background:var(--g4);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
/* PROGRESS */
.prog-bar{height:3px;background:var(--g1);flex-shrink:0}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--g6),var(--gold));
  transition:width .5s cubic-bezier(.4,0,.2,1);width:0%}
/* STEP LABEL */
.step-lbl{padding:7px 18px;background:var(--g0);border-bottom:1px solid var(--g2);
  display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink3);
  letter-spacing:.06em;text-transform:uppercase;flex-shrink:0}
.step-lbl .snum{background:var(--g7);color:#fff;border-radius:100px;padding:1px 8px;font-size:10px;font-weight:600}
/* CHAT */
.chat{flex:1;overflow-y:auto;padding:20px 16px 12px;display:flex;flex-direction:column;gap:14px}
.chat::-webkit-scrollbar{width:3px}
.chat::-webkit-scrollbar-thumb{background:var(--g2);border-radius:3px}
/* MESSAGES */
.row{display:flex;gap:8px;animation:fadeUp .35s ease}
.row.u{flex-direction:row-reverse}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.av.b{background:var(--g8);border:1.5px solid var(--g5)}
.av.b svg{width:16px;height:16px}
.av.u2{background:var(--gold);font-size:13px;font-weight:600;color:#fff}
.bub{max-width:80%;padding:10px 14px;font-size:13.5px;line-height:1.65}
.bub.b{background:var(--white);color:var(--ink);border-radius:4px 16px 16px 16px;
  border:1px solid var(--g2);box-shadow:0 2px 8px rgba(10,35,24,.06)}
.bub.u{background:var(--g8);color:#fff;border-radius:16px 4px 16px 16px}
.bub-t{font-size:10px;color:var(--ink4);margin-top:4px;opacity:.7}
.row.u .bub-t{text-align:right}
.hi{color:var(--g6);font-weight:600}
.gold{color:var(--gold);font-weight:600}
/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{border:1.5px solid var(--g5);color:var(--g7);background:var(--g0);
  border-radius:100px;padding:7px 15px;font-size:12.5px;font-weight:500;
  cursor:pointer;transition:all .18s;font-family:'Outfit',sans-serif}
.chip:hover{background:var(--g7);color:#fff;border-color:var(--g7)}
/* VISITOR */
.vis-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.vis-card{border:1.5px solid var(--g2);background:var(--white);border-radius:12px;
  padding:12px 8px;text-align:center;cursor:pointer;transition:all .2s}
.vis-card:hover{background:var(--g7);border-color:var(--g7)}
.vis-card:hover .vis-name{color:#fff}
.vis-icon{font-size:22px;margin-bottom:5px}
.vis-name{font-size:11px;font-weight:600;color:var(--ink2)}
/* SERVICE */
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.svc-card{background:var(--g0);border:1.5px solid var(--g2);border-radius:12px;
  padding:11px 12px;cursor:pointer;transition:all .2s}
.svc-card:hover{background:var(--g7);border-color:var(--g7);transform:translateY(-2px);
  box-shadow:0 4px 14px rgba(17,92,56,.2)}
.svc-card:hover .svc-title,.svc-card:hover .svc-dur,.svc-card:hover .svc-price{color:#fff}
.svc-title{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:3px}
.svc-dur{font-size:10px;color:var(--ink3);margin-bottom:4px}
.svc-price{font-size:13px;font-weight:600;color:var(--gold)}
/* THERAPIST */
.thx-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}
.thx-btn{border:1.5px solid var(--g2);background:var(--white);border-radius:10px;
  padding:9px 6px;text-align:center;cursor:pointer;transition:all .18s}
.thx-btn:hover{background:var(--g7);border-color:var(--g7)}
.thx-avatar{width:34px;height:34px;border-radius:50%;background:var(--g1);margin:0 auto 5px;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--g7)}
.thx-btn:hover .thx-avatar{background:rgba(255,255,255,.2);color:#fff}
.thx-name{font-size:11px;font-weight:500;color:var(--ink2)}
.thx-btn:hover .thx-name{color:#fff}
/* HEAR */
.hear-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.hear-chip{border:1.5px solid var(--g2);background:var(--white);color:var(--ink2);
  border-radius:10px;padding:7px 13px;font-size:12px;font-weight:500;
  cursor:pointer;transition:all .18s;font-family:'Outfit',sans-serif;
  display:flex;align-items:center;gap:5px}
.hear-chip:hover{background:var(--g7);color:#fff;border-color:var(--g7)}
/* DECLARATION */
.decl-box{background:var(--g0);border:1px solid var(--g2);border-radius:12px;
  padding:12px 14px;margin-top:10px;font-size:12px;color:var(--ink2);line-height:1.8}
.decl-box ol{margin-left:14px}
.decl-box li{margin-bottom:3px}
.decl-btns{display:flex;gap:8px;margin-top:10px}
.decl-yes{flex:1;padding:10px;border-radius:10px;background:var(--g7);color:#fff;border:none;
  font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s}
.decl-yes:hover{background:var(--g8)}
.decl-no{padding:10px 18px;border-radius:10px;background:transparent;color:var(--r);
  border:1.5px solid var(--r);font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer}
/* PAYMENT */
.pay-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.pay-card{border:1.5px solid var(--g2);background:var(--white);border-radius:12px;
  padding:12px;text-align:center;cursor:pointer;transition:all .2s}
.pay-card:hover{background:var(--gold);border-color:var(--gold)}
.pay-card:hover .pay-name{color:#fff}
.pay-icon{font-size:22px;margin-bottom:6px}
.pay-name{font-size:12px;font-weight:600;color:var(--ink2)}
/* SUMMARY */
.summary{background:var(--g9);border-radius:14px;padding:16px;margin-top:10px;font-size:13px}
.sum-row{display:flex;justify-content:space-between;align-items:center;
  padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.sum-row:last-child{border:none}
.sum-label{color:var(--g3);font-size:12px}
.sum-val{color:#fff;font-weight:500;text-align:right;font-size:12px;max-width:60%}
.sum-total{color:var(--gold);font-weight:700;font-size:15px}
/* TEXT INPUT */
.txt-inp-wrap{margin-top:10px;width:100%}
.txt-inp{width:100%;border:1.5px solid var(--g2);border-radius:10px;padding:10px 14px;
  font-family:'Outfit',sans-serif;font-size:14px;color:var(--ink);background:var(--white);
  outline:none;transition:border .2s}
.txt-inp:focus{border-color:var(--g5);box-shadow:0 0 0 3px rgba(34,168,84,.1)}
.txt-inp::placeholder{color:var(--ink4)}
.inp-row{display:flex;gap:8px;margin-top:8px}
.inp-btn{flex:1;padding:10px;background:var(--g7);color:#fff;border:none;
  border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;
  cursor:pointer;transition:all .18s}
.inp-btn:hover{background:var(--g8)}
.skip-btn{padding:10px 14px;background:transparent;color:var(--ink3);
  border:1.5px solid var(--g2);border-radius:10px;font-family:'Outfit',sans-serif;
  font-size:12px;cursor:pointer;transition:all .18s}
.skip-btn:hover{border-color:var(--g5);color:var(--g7)}
/* TYPING */
.typing-bub{display:flex;gap:4px;align-items:center;padding:12px 16px;background:var(--white);
  border:1px solid var(--g2);border-radius:4px 16px 16px 16px;box-shadow:0 2px 8px rgba(10,35,24,.06)}
.typing-bub span{width:6px;height:6px;background:var(--g4);border-radius:50%;animation:bounce 1.1s infinite}
.typing-bub span:nth-child(2){animation-delay:.18s}
.typing-bub span:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-5px);opacity:1}}
/* INPUT BAR */
.input-area{flex-shrink:0;padding:12px 14px 16px;border-top:1px solid var(--g1);background:var(--cream)}
.input-bar{display:flex;gap:8px;align-items:flex-end;background:var(--white);
  border:1.5px solid var(--g2);border-radius:14px;padding:8px 8px 8px 14px;transition:border-color .2s}
.input-bar:focus-within{border-color:var(--g5);box-shadow:0 0 0 3px rgba(34,168,84,.1)}
#uInp{flex:1;border:none;outline:none;font-family:'Outfit',sans-serif;font-size:13.5px;
  color:var(--ink);background:transparent;resize:none;max-height:100px;line-height:1.5}
#uInp::placeholder{color:var(--ink4)}
.send{width:36px;height:36px;border-radius:10px;background:var(--g7);border:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .18s;flex-shrink:0}
.send:hover{background:var(--g8);transform:scale(1.06)}
.send svg{width:15px;height:15px}
.input-hint{text-align:center;font-size:10px;color:var(--ink4);margin-top:7px;opacity:.7}
.confirm-btn{width:100%;padding:12px;margin-top:10px;
  background:linear-gradient(135deg,var(--g7),var(--g6));color:#fff;border:none;
  border-radius:12px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;
  cursor:pointer;transition:all .2s;letter-spacing:.03em}
.confirm-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(17,92,56,.3)}
.confirm-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.sec-badge{display:inline-block;background:var(--g7);color:#fff;font-size:10px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;border-radius:100px;padding:2px 10px;margin-bottom:8px}
.emoji-big{font-size:28px;display:block;margin-bottom:8px}
/* WHATSAPP */
.wa-section{margin-top:14px}
.wa-divider{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wa-divider span{font-size:10px;color:var(--ink4);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.wa-divider::before,.wa-divider::after{content:'';flex:1;height:1px;background:var(--g2)}
.wa-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 8px;border-radius:12px;border:none;cursor:pointer;
  font-family:'Outfit',sans-serif;font-size:12.5px;font-weight:600;
  transition:all .2s;text-decoration:none;color:#fff;}
.wa-btn svg{width:17px;height:17px;flex-shrink:0}
.wa-btn.wa1{background:#25D366;}
.wa-btn.wa1:hover{background:#1da851;transform:translateY(-1px);box-shadow:0 4px 16px rgba(37,211,102,.4)}
.wa-btn.wa2{background:#075E54;}
.wa-btn.wa2:hover{background:#054840;transform:translateY(-1px);box-shadow:0 4px 16px rgba(7,94,84,.4)}
/* GOOGLE FORM SUBMIT BTN */
.form-submit-btn{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:13px 16px;border-radius:12px;border:none;
  background:linear-gradient(135deg,#4285F4,#1a73e8);
  color:#fff;cursor:pointer;font-family:'Outfit',sans-serif;
  font-size:13.5px;font-weight:600;transition:all .2s;margin-bottom:12px;
}
.form-submit-btn:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(66,133,244,.45)}
.form-submit-btn svg{width:20px;height:20px;flex-shrink:0}
.form-submit-btn span:nth-child(2){flex:1;text-align:left}
.form-badge{
  background:rgba(255,255,255,.25);border-radius:20px;
  padding:2px 8px;font-size:10px;font-weight:600;
  letter-spacing:.04em;white-space:nowrap;
}

/* LOOKUP CARD */
.lookup-card{
  background:linear-gradient(135deg,var(--g0),var(--gold0));
  border:1.5px solid var(--g3);border-radius:14px;
  padding:14px 16px;margin-top:10px;
}
.lookup-found{display:flex;flex-direction:column;gap:6px}
.lookup-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.lookup-lbl{color:var(--ink3)}
.lookup-val{font-weight:600;color:var(--ink);text-align:right;max-width:60%}
.lookup-actions{display:flex;gap:8px;margin-top:10px}
.lookup-yes{flex:1;padding:9px;border-radius:10px;background:var(--g7);color:#fff;
  border:none;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.lookup-edit{padding:9px 14px;border-radius:10px;background:transparent;
  color:var(--ink3);border:1.5px solid var(--g2);
  font-family:'Outfit',sans-serif;font-size:12px;cursor:pointer}
.lookup-notfound{text-align:center;padding:8px 0;font-size:13px;color:var(--ink3)}
/* PHONE FIRST input hint */
.ph-hint{font-size:11px;color:var(--ink4);margin-top:5px;padding-left:2px}
</style>
</head>
<body>
<div class="shell">

var DB_KEY = 'thusare_customers';

function dbSave(phone, record){
  try {
    var db = JSON.parse(localStorage.getItem(DB_KEY)||'{}');
    var clean = phone.replace(/[\s\-()]/g,'');
    db[clean] = record;
    localStorage.setItem(DB_KEY, JSON.stringify(db));
  } catch(e){}
}

function dbLookup(phone){
  try {
    var db = JSON.parse(localStorage.getItem(DB_KEY)||'{}');
    var clean = phone.replace(/[\s\-()]/g,'');
    if(db[clean]) return db[clean];
    var suffix = clean.slice(-9);
    for(var k in db){ if(k.slice(-9)===suffix) return db[k]; }
  } catch(e){}
  return null;
}

function pickVisitor(val,lbl){ d.visitor=val; clearW('wgt'); userMsg(lbl); stepNat(); }

// ── STEP 4b: NATIONALITY ──
async function stepNat(){
  setLbl('4',L().steps[4]);
  await botMsg(M().natQ);
  var w=document.createElement('div'); w.className='row'; w.id='wgt';
  w.innerHTML='<div class="av b" style="opacity:0"></div>'
    +'<div class="txt-inp-wrap">'
    +'<input class="txt-inp" id="fi0" type="text" placeholder="'+L().natPh+'" maxlength="50"/>'

    +'<button class="inp-btn" onclick="submitNat()">'+L().btnCont+'</button>'
    +'<button class="skip-btn" onclick="skipNat()">'+L().btnSkip+'</button></div></div>';

}

function submitNat(){
  var v=document.getElementById('fi0').value.trim();

}
function skipNat(){ d.nationality='—'; clearW('wgt'); userMsg('⏭ Skip'); stepHeard(); }

async function stepHeard(){

  setTimeout(function(){chat.appendChild(r);scrollBot();},300);
}
function pickHeard(val,lbl){ d.heardFrom=val; clearW('wgt'); userMsg(lbl); stepService(); }

// ── STEP 6: SERVICE ──
async function stepService(){
  setLbl('6',L().steps[6]); setProg(6,10);

// ── STEP 7: THERAPIST ──
async function stepTherapist(){
  setLbl('7',L().steps[7]); setProg(7,10);

// ── STEP 8: DECLARATION ──
var _declIsRepeat = false;
async function stepDecl(isRepeat){
  _declIsRepeat = isRepeat || false;
  // Progress: repeat customers are at step ~8, new at step 8
  setLbl('8',L().steps[8]); setProg(8,10);
  await botMsg(M().declIntro(d.therapist));
  var items='';
  var di=M().declItems;
  for(var i=0;i<di.length;i++) items+='<li>'+di[i]+'</li>';
  var r=document.createElement('div'); r.className='row'; r.id='wgt';
  r.innerHTML='<div class="av b" style="opacity:0"></div>'
    +'<div><div class="bub b">'
    +'<div class="decl-box"><strong style="color:var(--g7);font-size:12px;display:block;margin-bottom:8px">'+M().declTitle+'</strong><ol>'+items+'</ol></div>'
    +'<div class="decl-btns">'
    +'<button class="decl-yes" onclick="agreeDecl()">'+L().btnYes+'</button>'
    +'<button class="decl-no" onclick="disagreeDecl()">'+L().btnNo+'</button>'
    +'</div></div></div>';
  setTimeout(function(){chat.appendChild(r);scrollBot();},300);
}
function agreeDecl(){ clearW('wgt'); userMsg(L().btnYes); stepPayment(_declIsRepeat); }
function disagreeDecl(){ botMsg(M().declNo); }

// ── STEP 9: PAYMENT ──
async function stepPayment(isRepeat){
  setLbl(isRepeat?'4':'9',L().steps[9]); setProg(isRepeat?8:9,10);
  await botMsg(isRepeat?M().payQr:M().payQ);
  var pc='';
  for(var i=0;i<L().payOpts.length;i++){
    pc+='<div class="pay-card" onclick="pickPayment(\''+L().payOpts[i]+'\',\''+L().payIco[i]+' '+L().payOpts[i]+'\')">'
      +'<div class="pay-icon">'+L().payIco[i]+'</div><div class="pay-name">'+L().payOpts[i]+'</div></div>';
  }
  var g=document.createElement('div'); g.className='row'; g.id='wgt';
  g.innerHTML='<div class="av b" style="opacity:0"></div><div><div class="pay-grid">'+pc+'</div></div>';
  setTimeout(function(){chat.appendChild(g);scrollBot();},300);
}
function pickPayment(val,lbl){ d.payment=val; clearW('wgt'); userMsg(lbl); stepSummary(); }

// ── STEP 10: SUMMARY ──
async function stepSummary(){
  setLbl('✓',L().steps[10]); setProg(10,10);
  var isRepeat=d.type==='Repeat';
  await botMsg(M().sumTitle(d.name));
  var sl=L().sumLbls;
  var rows='<div class="sum-row"><span class="sum-label">'+sl[0]+'</span><span class="sum-val">'+d.name+'</span></div>'
    +'<div class="sum-row"><span class="sum-label">'+sl[1]+'</span><span class="sum-val">'+d.type+'</span></div>';
  if(!isRepeat){
    rows+='<div class="sum-row"><span class="sum-label">'+sl[2]+'</span><span class="sum-val">'+d.phone+'</span></div>';
    if(d.email&&d.email!=='—') rows+='<div class="sum-row"><span class="sum-label">'+sl[3]+'</span><span class="sum-val">'+d.email+'</span></div>';
    rows+='<div class="sum-row"><span class="sum-label">'+sl[4]+'</span><span class="sum-val">'+d.nationality+'</span></div>'
      +'<div class="sum-row"><span class="sum-label">'+sl[5]+'</span><span class="sum-val">'+d.visitor+'</span></div>'
      +'<div class="sum-row"><span class="sum-label">'+sl[6]+'</span><span class="sum-val">'+d.heardFrom+'</span></div>';
  }
  rows+='<div class="sum-row"><span class="sum-label">'+sl[7]+'</span><span class="sum-val">'+d.service.label+'</span></div>'
    +'<div class="sum-row"><span class="sum-label">'+sl[8]+'</span><span class="sum-val">'+d.therapist+'</span></div>'
    +'<div class="sum-row"><span class="sum-label">'+sl[9]+'</span><span class="sum-val">'+d.payment+'</span></div>'
    +'<div class="sum-row"><span class="sum-label">'+sl[10]+'</span><span class="sum-val sum-total">'+d.service.price+'</span></div>';

    +'<div class="summary">'+rows+'</div>'

    +'</div></div>';
  setTimeout(function(){chat.appendChild(r);scrollBot();},300);
}

// ── SERVICE NAME MAP to match Google Form dropdown exact values ──

var VISITOR_MAP = {
  'Tourist':          'Tourist',

  '観光客':            'Tourist',
  'ビジネス訪問者':      'Business visitor',
  'Resident':         'Resident',

};

};

var PAY_MAP = {

};

function buildFormURL(){
  var base='https://docs.google.com/forms/d/e/1FAIpQLScKtigPoaln2lA-6U24CUL4ofaaYk2CUSG0hjYtyAL8RJ5_6A/viewform';
  var isR=d.type==='Repeat';

  function enc(v){ return encodeURIComponent(v||''); }

  var svcVal = SVC_MAP[d.service.key] || d.service.label;
  var visitorVal = VISITOR_MAP[d.visitor] || d.visitor || '';
  var heardVal = HEARD_MAP[d.heardFrom] || d.heardFrom || '';
  var payVal = PAY_MAP[d.payment] || d.payment;

  var url = base
    +'?entry.1000027='+enc(d.name)
    +'&entry.1000057='+enc(d.type)
    +'&entry.1738860595='+enc(svcVal)
    +'&entry.1025460438='+enc(d.therapist)
    +'&entry.1000020=YES'
    +'&entry.513284361='+enc(payVal);

  if(!isR){
    url += '&entry.967112212='+enc(d.phone)
         +'&entry.604448062='+enc(d.email==='—'?'':d.email)
         +'&entry.1830763802='+enc(visitorVal)
         +'&entry.2055232012='+enc(d.nationality==='—'?'':d.nationality)
         +'&entry.238597302='+enc(heardVal);
  }
  return url;
}

function buildWAMsg(){
  var isR=d.type==='Repeat';
  var t=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  var dt=new Date().toLocaleDateString('en-GB');
  var msg='*NEW REGISTRATION - Thusare Talking Hands*\n';
  msg+='--------------------------------\n';
  msg+='*Name:* '+d.name+'\n';
  msg+='*Type:* '+d.type+' Customer\n';
  if(!isR){
    msg+='*Phone:* '+d.phone+'\n';
    if(d.email&&d.email!=='—') msg+='*Email:* '+d.email+'\n';
    msg+='*Visitor:* '+d.visitor+'\n';
    if(d.nationality&&d.nationality!=='—') msg+='*Nationality:* '+d.nationality+'\n';
    msg+='*Heard from:* '+d.heardFrom+'\n';
  }
  msg+='--------------------------------\n';
  msg+='*Service:* '+d.service.label+'\n';
  msg+='*Price:* '+d.service.price+'\n';
  msg+='*Therapist:* '+d.therapist+'\n';
  msg+='*Payment:* '+d.payment+'\n';
  msg+='--------------------------------\n';
  msg+='Time: '+t+' | '+dt;
  return encodeURIComponent(msg);
}

function openWA(num){
  var msg=buildWAMsg();
  window.open('https://wa.me/'+num+'?text='+msg,'_blank');
}

function openForm(){
  var url=buildFormURL();
  window.open(url,'_blank');
}

  var formSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>';

  var wr=document.createElement('div'); wr.className='row';
  var waHtml='<div class="wa-section">'
    // Google Form button
    +'<button class="form-submit-btn" onclick="openForm()">'
    +formSVG
    +'<span>Submit to Google Form</span>'
    +'<span class="form-badge">Auto Filled ✓</span>'
    +'</button>'
    // Divider
    +'<div class="wa-divider"><span>Also notify staff via WhatsApp</span></div>'
    // WA buttons
    +'<div class="wa-btns">'
    +'<button class="wa-btn wa1" onclick="openWA(94717776960)">'+waSVG+' +94717776960</button>'
    +'<button class="wa-btn wa2" onclick="openWA(94779896183)">'+waSVG+' +94779896183</button>'
    +'</div></div>';

  wr.innerHTML='<div class="av b" style="opacity:0"></div>'
    +'<div><div class="bub b" style="max-width:92%">'+waHtml+'</div></div>';
  setTimeout(function(){chat.appendChild(wr);scrollBot();},400);

  // ── Save to localStorage DB ──
  try {
    dbSave(d.phone, {
      name:        d.name,
      email:       d.email,

function onSend(){
  var v=document.getElementById('uInp').value.trim(); if(!v)return;
  document.getElementById('uInp').value=''; document.getElementById('uInp').style.height='auto';
  var fi=document.getElementById('fi0'); if(fi){fi.value=v;return;}
  botMsg(M().fallback);
}

function goHome(){
  var btn=document.getElementById('homeBtn');
  btn.classList.add('pulse-anim');
  setTimeout(function(){btn.classList.remove('pulse-anim');},400);
  chat.innerHTML='';
  d={name:'',phone:'',email:'',type:'',visitor:'',nationality:'',heardFrom:'',service:null,therapist:'',payment:''};

}
